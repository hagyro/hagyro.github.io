<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Ιδιωτική Προεπισκόπηση — Είσοδος</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background: #0B1F3A;
      color: #1A1A1A;
    }
    .gate-wrap {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background:
        radial-gradient(circle at 80% 20%, rgba(157, 34, 53, 0.25), transparent 45%),
        linear-gradient(135deg, #071426 0%, #0B1F3A 60%, #14325B 100%);
    }
    .gate-card {
      width: min(440px, 100%);
      background: #FFFFFF;
      border-top: 4px solid #9D2235;
      border-radius: 2px;
      padding: 2.25rem 2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    .gate-eyebrow {
      margin: 0 0 0.5rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #52504C;
    }
    .gate-title {
      margin: 0 0 0.75rem;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.65rem;
      color: #0B1F3A;
      line-height: 1.2;
    }
    .gate-desc {
      margin: 0 0 1.5rem;
      font-size: 0.94rem;
      line-height: 1.55;
      color: #52504C;
    }
    .gate-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #1A1A1A;
    }
    .gate-input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      font-size: 1rem;
      border: 1px solid #BDB9B1;
      border-radius: 2px;
      margin-bottom: 1rem;
    }
    .gate-input:focus {
      outline: 3px solid #E0A800;
      outline-offset: 1px;
      border-color: #0B1F3A;
    }
    .gate-btn {
      width: 100%;
      padding: 0.8rem 1.25rem;
      font-size: 0.98rem;
      font-weight: 600;
      background: #9D2235;
      color: #FFFFFF;
      border: 0;
      border-radius: 2px;
      cursor: pointer;
    }
    .gate-btn:hover { background: #7D1929; }
    .gate-btn:disabled { opacity: 0.65; cursor: wait; }
    .gate-error {
      margin: 0.9rem 0 0;
      font-size: 0.88rem;
      font-weight: 600;
      color: #9D2235;
      min-height: 1.25rem;
    }
    .gate-foot {
      margin: 1.25rem 0 0;
      padding-top: 1rem;
      border-top: 1px solid #EAE7E1;
      font-size: 0.78rem;
      color: #52504C;
    }
    #viewer-frame {
      display: none;
      width: 100vw;
      height: 100dvh;
      border: 0;
    }
  </style>
</head>
<body>
  <div id="gate" class="gate-wrap">
    <main class="gate-card">
      <p class="gate-eyebrow">Protected Preview · AES-256-GCM</p>
      <h1 class="gate-title">Ιδιωτική Προεπισκόπηση</h1>
      <p class="gate-desc">
        Εισαγάγετε τον κωδικό πρόσβασης για να ανοίξετε το διαδραστικό πρότυπο.
        <br /><span style="font-size:0.85rem;">Enter the access passphrase to open the interactive prototype.</span>
      </p>
      <form id="unlock-form" autocomplete="off">
        <label class="gate-label" for="pass-input">Κωδικός πρόσβασης / Passphrase</label>
        <input id="pass-input" class="gate-input" type="password" required autofocus placeholder="••••••••••" />
        <button id="unlock-btn" class="gate-btn" type="submit">Είσοδος →</button>
        <p id="gate-error" class="gate-error" role="alert" aria-live="polite"></p>
      </form>
      <p class="gate-foot">
        Το περιεχόμενο είναι πλήρως κρυπτογραφημένο (AES-256-GCM) και αποκρυπτογραφείται τοπικά στον browser σας.
      </p>
    </main>
  </div>

  <script>
    (function () {
      "use strict";
      const payload = JSON.parse(document.getElementById("encrypted-payload").textContent);
      const gate = document.getElementById("gate");
      const frame = document.getElementById("viewer-frame");
      const form = document.getElementById("unlock-form");
      const input = document.getElementById("pass-input");
      const btn = document.getElementById("unlock-btn");
      const errEl = document.getElementById("gate-error");

      let unlockedPages = null;
      let unlockedShared = null;
      let unlockedTitles = {};

      function b64ToBytes(b64) {
        const bin = atob(b64);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return arr;
      }

      async function decryptBundle(password) {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
          "raw",
          enc.encode(password),
          "PBKDF2",
          false,
          ["deriveKey"]
        );
        const aesKey = await crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: b64ToBytes(payload.salt),
            iterations: payload.iterations,
            hash: "SHA-256"
          },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
        const plainBuf = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: b64ToBytes(payload.iv) },
          aesKey,
          b64ToBytes(payload.data)
        );
        return JSON.parse(new TextDecoder().decode(plainBuf));
      }

      function renderPage(rawHref) {
        if (!unlockedPages) return;
        const [beforeHash, hashPart] = String(rawHref || "index.html").split("#");
        const [pagePart, queryPart] = beforeHash.split("?");
        const pageName = unlockedPages[pagePart] ? pagePart : "index.html";
        const searchStr = queryPart ? "?" + queryPart : "";
        const hashStr = hashPart || "";

        const bootSnippet =
          "window.__PROTO_SEARCH = " + JSON.stringify(searchStr) + ";" +
          "window.__PROTO_HASH = " + JSON.stringify(hashStr) + ";";

        const html = unlockedPages[pageName]
          .replace("/*__PROTO_CSS__*/", "<" + "style>" + unlockedShared.css + "<" + "/style>")
          .replace(/__LOGO_DARK__/g, unlockedShared.logoDark)
          .replace(/__LOGO_LIGHT__/g, unlockedShared.logoLight)
          .replace("/*__PROTO_JS__*/", "<" + "script>" + bootSnippet + "<" + "/script><" + "script>" + unlockedShared.js + "<" + "/script>");
        frame.srcdoc = html;
        if (unlockedTitles[pageName]) document.title = unlockedTitles[pageName];
      }

      window.addEventListener("message", function (e) {
        if (e.data && e.data.type === "unipi-navigate" && unlockedPages) {
          renderPage(e.data.href);
        }
      });

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        errEl.textContent = "";
        btn.disabled = true;
        btn.textContent = "Αποκρυπτογράφηση…";
        try {
          const bundle = await decryptBundle(input.value);
          unlockedPages = bundle.pages;
          unlockedShared = bundle.shared;
          unlockedTitles = bundle.titles || {};
          gate.style.display = "none";
          frame.style.display = "block";
          renderPage("index.html");
        } catch {
          errEl.textContent = "Λάθος κωδικός πρόσβασης. Δοκιμάστε ξανά.";
          input.select();
          input.focus();
        } finally {
          btn.disabled = false;
          btn.textContent = "Είσοδος →";
        }
      });
    })();
  </script>
