<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Idea Vault — Εμπιστευτικό</title>
<style>
  :root{
    --paper:#FAF7F0;
    --paper-2:#F3EEE2;
    --ink:#1B2A33;
    --muted:#5E6B76;
    --aegean:#175C7C;
    --aegean-deep:#0F3D53;
    --ochre:#C89B3C;
    --ochre-deep:#A97E28;
    --line:rgba(15,61,83,.14);
    --line-soft:rgba(15,61,83,.08);
    --serif:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --wrap:min(940px,92vw);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:17px;line-height:1.6;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  a{color:var(--aegean);text-underline-offset:2px;}
  a:hover{color:var(--aegean-deep);}
  ::selection{background:rgba(200,155,60,.28);}

  /* ---------- Monogram ---------- */
  .mono{
    display:inline-grid;place-items:center;
    width:56px;height:56px;flex:none;
    font-family:var(--serif);font-size:1.35rem;font-weight:600;letter-spacing:.02em;
    color:var(--aegean-deep);background:var(--paper);
    border:1.5px solid var(--ochre);position:relative;
  }
  .mono::after{content:"";position:absolute;inset:4px;border:1px solid var(--line);}

  /* ---------- GATE ---------- */
  .gate{
    position:fixed;inset:0;z-index:50;display:grid;place-items:center;
    padding:24px;background:
      radial-gradient(120% 90% at 50% -10%, #FFFDF8 0%, var(--paper) 46%, var(--paper-2) 100%);
    transition:opacity .5s ease;
  }
  .gate.hide{opacity:0;pointer-events:none;}
  .gate-card{width:min(430px,100%);text-align:center;}
  .gate .mono{width:64px;height:64px;font-size:1.5rem;margin:0 auto 26px;}
  .gate-kicker{
    font-size:.74rem;letter-spacing:.26em;color:var(--ochre-deep);
    margin:0 0 10px;font-weight:600;
  }
  .gate-title{
    font-family:var(--serif);font-weight:600;color:var(--aegean-deep);
    font-size:1.7rem;line-height:1.15;margin:0 0 8px;
  }
  .gate-sub{color:var(--muted);font-size:.95rem;margin:0 0 30px;}
  .gate-form{display:flex;flex-direction:column;gap:14px;}
  .field{position:relative;}
  .field input{
    width:100%;font-family:var(--sans);font-size:1rem;color:var(--ink);
    background:rgba(255,255,255,.6);border:1px solid var(--line);
    padding:14px 15px;border-radius:2px;outline:none;
    transition:border-color .18s ease,box-shadow .18s ease;
  }
  .field input::placeholder{color:#9aa6ad;}
  .field input:focus{border-color:var(--aegean);box-shadow:0 0 0 3px rgba(23,92,124,.12);}
  .gate-btn{
    font-family:var(--sans);font-size:.95rem;font-weight:600;letter-spacing:.02em;
    color:#fff;background:var(--aegean-deep);border:none;border-radius:2px;
    padding:14px 18px;cursor:pointer;transition:background .18s ease,transform .08s ease;
  }
  .gate-btn:hover{background:var(--aegean);}
  .gate-btn:active{transform:translateY(1px);}
  .gate-btn:disabled{opacity:.6;cursor:progress;}
  .gate-error{
    min-height:1.2em;color:#9B3B2E;font-size:.86rem;margin:2px 0 0;
    opacity:0;transition:opacity .2s ease;
  }
  .gate-error.show{opacity:1;}
  .gate-foot{
    margin-top:28px;padding-top:18px;border-top:1px solid var(--line-soft);
    color:var(--muted);font-size:.78rem;letter-spacing:.14em;
  }
  :focus-visible{outline:2px solid var(--ochre);outline-offset:3px;}

  /* ---------- Brandbar (after unlock) ---------- */
  .brandbar{
    position:sticky;top:0;z-index:20;display:none;align-items:center;gap:12px;
    padding:12px clamp(18px,5vw,40px);
    background:rgba(250,247,240,.86);backdrop-filter:saturate(1.2) blur(8px);
    border-bottom:1px solid var(--line-soft);
  }
  .brandbar.on{display:flex;}
  .brandbar .mono{width:38px;height:38px;font-size:.95rem;}
  .brandbar .mono::after{inset:3px;}
  .brandbar-txt{display:flex;flex-direction:column;line-height:1.15;}
  .brandbar-txt b{font-family:var(--serif);font-weight:600;color:var(--aegean-deep);font-size:.98rem;}
  .brandbar-txt span{font-size:.72rem;letter-spacing:.16em;color:var(--ochre-deep);}
  .brandbar-tag{margin-left:auto;font-size:.72rem;letter-spacing:.14em;color:var(--muted);}

  /* ---------- Content shell ---------- */
  #vault{display:none;}
  #vault.on{display:block;}
  .wrap,.hero,.prop,.timeline,.portfolio,.synergies,.method,.contact{
    width:var(--wrap);margin-inline:auto;
  }
  section,header,footer{padding-block:clamp(56px,8vw,104px);}
  .section-eyebrow{
    font-size:.76rem;letter-spacing:.22em;color:var(--ochre-deep);
    font-weight:600;margin:0 0 14px;
  }
  .section-title{
    font-family:var(--serif);font-weight:600;color:var(--aegean-deep);
    font-size:clamp(1.5rem,3.4vw,2.15rem);line-height:1.16;margin:0 0 18px;
    letter-spacing:-.01em;
  }
  .section-lead{color:var(--muted);max-width:60ch;margin:0 0 8px;font-size:1.02rem;}

  /* ---------- Hero ---------- */
  .hero{
    padding-top:clamp(64px,10vw,128px);
    border-bottom:1px solid var(--line-soft);
    position:relative;
  }
  .hero .eyebrow{
    font-size:.78rem;letter-spacing:.24em;color:var(--ochre-deep);font-weight:600;
    margin:0 0 22px;
  }
  .hero-title{
    font-family:var(--serif);font-weight:600;color:var(--aegean-deep);
    font-size:clamp(2.1rem,5.2vw,3.5rem);line-height:1.07;letter-spacing:-.015em;
    margin:0 0 26px;max-width:20ch;
  }
  .hero-by{font-size:1.06rem;color:var(--ink);margin:0 0 40px;}
  .hero-by strong{color:var(--aegean-deep);}
  .hero-stats{display:flex;align-items:center;gap:clamp(16px,4vw,40px);flex-wrap:wrap;}
  .stat{display:flex;flex-direction:column;gap:2px;}
  .stat-n{font-family:var(--serif);font-size:2rem;color:var(--ochre-deep);line-height:1;font-weight:600;}
  .stat-l{font-size:.82rem;letter-spacing:.04em;color:var(--muted);}
  .stat-div{width:1px;height:38px;background:var(--line);}

  /* ---------- Proposition ---------- */
  .prop-grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:1px;
    background:var(--line-soft);border:1px solid var(--line-soft);
    margin:8px 0 30px;
  }
  .prop-item{background:var(--paper);padding:24px 26px;}
  .prop-k{
    display:block;font-family:var(--serif);font-size:1.12rem;color:var(--aegean);
    font-weight:600;margin-bottom:8px;
  }
  .prop-item p{margin:0;color:var(--muted);font-size:.96rem;}
  .prop-thesis{font-size:1.12rem;max-width:66ch;margin:0;}
  .prop-thesis strong{color:var(--aegean-deep);}

  /* ---------- Timeline ---------- */
  .tl-list{list-style:none;margin:8px 0 0;padding:0;position:relative;}
  .tl-list::before{
    content:"";position:absolute;left:7px;top:8px;bottom:8px;width:1.5px;
    background:linear-gradient(var(--ochre),var(--line));
  }
  .tl-item{
    position:relative;padding:0 0 26px 40px;display:grid;
    grid-template-columns:130px 1fr;gap:6px 22px;align-items:baseline;
  }
  .tl-item::before{
    content:"";position:absolute;left:0;top:8px;width:15px;height:15px;
    border-radius:50%;background:var(--paper);border:2px solid var(--ochre);
  }
  .tl-date{
    font-family:var(--serif);font-weight:600;color:var(--aegean-deep);
    font-size:1.05rem;white-space:nowrap;
  }
  .tl-body{color:var(--ink);font-size:.98rem;}
  .tl-body strong{color:var(--aegean);}

  /* ---------- Portfolio ---------- */
  .sector{margin-top:52px;}
  .sector-head{
    display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    padding-bottom:12px;margin-bottom:14px;border-bottom:1.5px solid var(--aegean-deep);
  }
  .sector-name{
    font-family:var(--serif);font-weight:600;color:var(--aegean-deep);
    font-size:1.3rem;margin:0;letter-spacing:-.01em;
  }
  .sector-count{font-size:.78rem;letter-spacing:.14em;color:var(--ochre-deep);flex:none;}

  .idea-card{border-bottom:1px solid var(--line-soft);}
  .idea-head{
    width:100%;display:flex;align-items:center;gap:16px;text-align:left;
    background:none;border:none;cursor:pointer;font-family:var(--sans);color:inherit;
    padding:20px 4px;
  }
  .idea-head:hover .idea-name{color:var(--ochre-deep);}
  .idea-titles{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;}
  .idea-name{
    font-family:var(--serif);font-size:1.22rem;font-weight:600;color:var(--aegean-deep);
    transition:color .16s ease;
  }
  .idea-tag{font-size:.9rem;color:var(--muted);}
  .idea-score{
    flex:none;font-family:var(--serif);font-weight:600;font-size:1.15rem;
    color:var(--ochre-deep);min-width:58px;text-align:right;
  }
  .idea-score-max{font-size:.72rem;color:var(--muted);font-family:var(--sans);}
  .idea-chevron{
    flex:none;width:11px;height:11px;border-right:2px solid var(--aegean);
    border-bottom:2px solid var(--aegean);transform:rotate(45deg);
    transition:transform .28s ease;margin-right:4px;
  }
  .idea-card.open .idea-chevron{transform:rotate(-135deg);}

  .idea-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s ease;}
  .idea-card.open .idea-body{grid-template-rows:1fr;}
  .idea-body-inner{overflow:hidden;min-height:0;}
  .idea-card.open .idea-body-inner{padding:4px 4px 30px;}
  .idea-body-inner{padding:0 4px;}
  .tb{margin-bottom:16px;max-width:74ch;}
  .tb h4,.sources h4{
    font-size:.72rem;letter-spacing:.16em;color:var(--ochre-deep);font-weight:700;
    margin:0 0 5px;text-transform:none;
  }
  .tb p{margin:0;font-size:.97rem;color:var(--ink);}
  .tb ul{margin:0;padding-left:1.1em;}
  .tb li{margin-bottom:4px;font-size:.97rem;}
  .tb strong{color:var(--aegean-deep);}
  .sources{border-top:1px solid var(--line-soft);padding-top:14px;margin-top:20px;}
  .sources ol{margin:0;padding-left:1.4em;}
  .sources li{font-size:.82rem;color:var(--muted);margin-bottom:3px;word-break:break-word;}
  .sources a{color:var(--aegean);text-decoration:none;border-bottom:1px solid var(--line);}
  .sources a:hover{border-color:var(--aegean);}

  /* ---------- Synergies ---------- */
  .synergies{background:var(--paper-2);width:100%;}
  .synergies>*{width:var(--wrap);margin-inline:auto;}
  .synergies>.syn-grid{margin-top:24px;}
  .syn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
  .syn-item{padding:22px 24px;background:var(--paper);border-left:2px solid var(--ochre);}
  .syn-k{display:block;font-family:var(--serif);font-size:1.06rem;color:var(--aegean-deep);font-weight:600;margin-bottom:7px;}
  .syn-item p{margin:0;color:var(--muted);font-size:.95rem;}
  .syn-item strong{color:var(--aegean);}

  /* ---------- Method ---------- */
  .method-list{list-style:none;counter-reset:step;margin:14px 0 0;padding:0;
    display:grid;grid-template-columns:repeat(2,1fr);gap:1px;
    background:var(--line-soft);border:1px solid var(--line-soft);}
  .method-step{background:var(--paper);padding:26px 26px 28px;counter-increment:step;position:relative;}
  .method-step::before{
    content:"0" counter(step);font-family:var(--serif);font-size:.95rem;color:var(--ochre);
    font-weight:600;letter-spacing:.08em;
  }
  .method-k{display:block;font-family:var(--serif);font-size:1.2rem;color:var(--aegean-deep);font-weight:600;margin:8px 0 7px;}
  .method-step p{margin:0;color:var(--muted);font-size:.96rem;}

  /* ---------- Contact ---------- */
  .contact{border-top:1px solid var(--line);text-align:left;}
  .contact-name{font-family:var(--serif);font-weight:600;color:var(--aegean-deep);font-size:1.9rem;margin:6px 0 6px;}
  .contact-role{color:var(--muted);margin:0 0 18px;}
  .contact-email{font-size:1.25rem;margin:0 0 26px;}
  .contact-email a{font-family:var(--serif);color:var(--aegean);border-bottom:1px solid var(--ochre);text-decoration:none;}
  .contact-note{font-size:.82rem;color:var(--muted);letter-spacing:.02em;border-top:1px solid var(--line-soft);padding-top:18px;max-width:52ch;}

  /* ---------- Reveal ---------- */
  .reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease;}
  .reveal.in{opacity:1;transform:none;}

  /* ---------- Responsive ---------- */
  @media (max-width:720px){
    body{font-size:16px;}
    .prop-grid,.syn-grid,.method-list{grid-template-columns:1fr;}
    .tl-item{grid-template-columns:1fr;gap:2px;padding-left:34px;}
    .tl-date{font-size:1rem;}
    .idea-head{gap:12px;padding:18px 2px;}
    .idea-score{min-width:48px;font-size:1.05rem;}
    .hero-stats{gap:20px;}
    .stat-div{display:none;}
    .brandbar-tag{display:none;}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    *{transition:none!important;animation:none!important;}
    .reveal{opacity:1;transform:none;}
  }
</style>
</head>

  <script>
  (function(){
    "use strict";
    var SS_KEY = "ideavault_unlocked_v1";

    function b64ToBytes(b64){
      var bin = atob(b64), n = bin.length, u = new Uint8Array(n);
      for (var i=0;i<n;i++) u[i] = bin.charCodeAt(i);
      return u;
    }

    async function deriveKey(password, salt, iterations){
      var enc = new TextEncoder();
      var base = await crypto.subtle.importKey(
        "raw", enc.encode(password), {name:"PBKDF2"}, false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        {name:"PBKDF2", salt:salt, iterations:iterations, hash:"SHA-256"},
        base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    }

    async function decryptPayload(password){
      var p = JSON.parse(document.getElementById("vault-payload").textContent);
      var salt = b64ToBytes(p.salt), iv = b64ToBytes(p.iv), ct = b64ToBytes(p.ct);
      var key = await deriveKey(password, salt, p.iterations);
      var buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, ct);
      return new TextDecoder().decode(buf);
    }

    var revObserver = null;
    function initReveal(root){
      var els = root.querySelectorAll(".reveal");
      var reduce = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
      if (reduce || !("IntersectionObserver" in window)){
        els.forEach(function(el){ el.classList.add("in"); });
        return;
      }
      revObserver = new IntersectionObserver(function(entries){
        entries.forEach(function(e){
          if (e.isIntersecting){ e.target.classList.add("in"); revObserver.unobserve(e.target); }
        });
      }, {rootMargin:"0px 0px -8% 0px", threshold:.08});
      els.forEach(function(el){ revObserver.observe(el); });
    }

    function mount(html){
      var vault = document.getElementById("vault");
      vault.innerHTML = html;
      vault.classList.add("on");
      document.getElementById("brandbar").classList.add("on");
      // accordion via delegation (idea-head are real <button>s → Enter/Space native)
      vault.addEventListener("click", function(e){
        var head = e.target.closest(".idea-head");
        if (!head) return;
        var card = head.closest(".idea-card");
        var open = card.classList.toggle("open");
        head.setAttribute("aria-expanded", open ? "true" : "false");
      });
      initReveal(vault);
      var first = vault.querySelector(".hero-title");
      if (first){ first.setAttribute("tabindex","-1"); first.focus({preventScroll:true}); }
    }

    function reveal(html){
      var gate = document.getElementById("gate");
      gate.classList.add("hide");
      window.setTimeout(function(){ gate.style.display = "none"; }, 520);
      mount(html);
    }

    function showError(msg){
      var el = document.getElementById("gate-error");
      el.textContent = msg;
      el.classList.add("show");
    }

    var form = document.getElementById("gate-form");
    var btn = document.getElementById("gate-btn");
    var pw = document.getElementById("pw");

    form.addEventListener("submit", async function(e){
      e.preventDefault();
      var err = document.getElementById("gate-error");
      err.classList.remove("show");
      var pass = pw.value;
      if (!pass){ showError("Συμπληρώστε τον κωδικό."); return; }
      if (!(window.crypto && crypto.subtle)){
        showError("Ο browser δεν υποστηρίζει την απαιτούμενη κρυπτογράφηση."); return;
      }
      btn.disabled = true;
      var prev = btn.textContent; btn.textContent = "Αποκρυπτογράφηση…";
      try{
        var html = await decryptPayload(pass);
        try{ sessionStorage.setItem(SS_KEY, html); }catch(_){}
        reveal(html);
      }catch(ex){
        btn.disabled = false; btn.textContent = prev;
        showError("Λάθος κωδικός. Δοκιμάστε ξανά.");
        pw.select();
      }
    });

    // Auto-unlock within same tab session
    try{
      var cached = sessionStorage.getItem(SS_KEY);
      if (cached){
        var g = document.getElementById("gate");
        g.classList.add("hide"); g.style.display = "none";
        mount(cached);
      }
    }catch(_){}

    window.addEventListener("DOMContentLoaded", function(){ pw.focus(); });
  })();
  </script>
</body>
