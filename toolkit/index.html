const SS_KEY = "gate_pw_toolkit";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const salt = b64(PAYLOAD.salt), iv = b64(PAYLOAD.iv), ct = b64(PAYLOAD.ct);
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt, iterations:PAYLOAD.iter, hash:"SHA-256" },
    km, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv }, key, ct);
  return new TextDecoder().decode(pt);
}
async function attempt(pw, silent) {
  const btn = document.getElementById("btn"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = "";
  try {
    const html = await unlock(pw);
    try { sessionStorage.setItem(SS_KEY, pw); } catch(e) {}
    document.open(); document.write(html); document.close();
  } catch(e) {
    btn.disabled = false;
    if (!silent) err.textContent = "Λάθος κωδικός. Δοκιμάστε ξανά.";
  }
}
document.getElementById("f").addEventListener("submit", ev => {
  ev.preventDefault();
  const pw = document.getElementById("pw").value;
  if (pw) attempt(pw, false);
});
try {
  const saved = sessionStorage.getItem(SS_KEY);
  if (saved) attempt(saved, true);
} catch(e) {}
</script>
