<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Δ1 — Πρώτες εντυπώσεις</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">
 <div class="card" id="form">
  <span class="tag">Δ1</span>
  <h1>Πρώτες εντυπώσεις</h1>

  <div class="q">α) Τι σας εντυπωσίασε περισσότερο;</div>
  <textarea id="ta" placeholder="Γράψτε λίγες λέξεις…"></textarea>

  <div class="q">β) Τι σας προβληματίζει;</div>
  <textarea id="tb" placeholder="Γράψτε λίγες λέξεις…"></textarea>

  <button class="send" id="send">Υποβολή</button>
  <div class="err" id="err"></div>
 </div>

 <div class="card done" id="thanks" style="display:none">
  <div class="check">✓</div>
  <h1>Ευχαριστούμε!</h1>
  <p class="sub">Η απάντησή σας καταγράφηκε.</p>
 </div>
</div>

<script src="config.js"></script>
<script>
const SLOT="qrPollL1close";
if(alreadyVoted(SLOT)) showThanks();
function showThanks(){
  document.getElementById("form").style.display="none";
  document.getElementById("thanks").style.display="block";
}
document.getElementById("send").onclick = async ()=>{
  const a=document.getElementById("ta").value.trim();
  const b=document.getElementById("tb").value.trim();
  if(!a && !b){ document.getElementById("err").textContent="Συμπληρώστε τουλάχιστον ένα πεδίο."; return; }
  const btn=document.getElementById("send"); btn.disabled=true;
  const {error}=await castVote(SLOT,{impressed:a, concern:b});
  if(error){ document.getElementById("err").textContent="Σφάλμα — δοκιμάστε ξανά."; btn.disabled=false; return; }
  markVoted(SLOT); showThanks();
};
</script>
</body>
</html>
