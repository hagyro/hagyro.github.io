<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Αποτελέσματα — Live</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--ink:#f2f3f7;--muted:#9aa0ad;--accent:#4f7cff;--line:#2a2e3a;--end:#ff8a4f}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
h1{font-size:24px;margin:0}
.controls{display:flex;gap:8px;flex-wrap:wrap}
select,button{background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}
.total{color:var(--muted);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}
h2{font-size:18px;margin:0 0 4px}
.qlabel{color:var(--muted);font-size:14px;margin:14px 0 10px}
.row{display:flex;align-items:center;gap:12px;margin:9px 0}
.lbl{flex:0 0 200px;font-size:15px;text-align:right;color:var(--ink)}
.barwrap{flex:1;background:#222634;border-radius:8px;overflow:hidden;height:30px;position:relative}
.bar{height:100%;background:var(--accent);border-radius:8px;transition:width .5s;min-width:2px}
.bar.end{background:var(--end)}
.cnt{flex:0 0 70px;font-size:14px;color:var(--muted)}
.legend{font-size:13px;color:var(--muted);margin-bottom:8px}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin:0 4px 0 12px;vertical-align:middle}
.txtitem{background:#222634;border-radius:10px;padding:11px 14px;margin:7px 0;font-size:15px}
.col2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:700px){.col2{grid-template-columns:1fr}.lbl{flex:0 0 110px;font-size:13px}}
</style>
</head>
<body>
<div class="top">
 <h1>📊 Αποτελέσματα — Live</h1>
 <div class="controls">
  <select id="slotSel"></select>
  <button id="refresh">↻ Ανανέωση</button>
  <button id="export">⬇ Export CSV</button>
  <span class="total" id="total"></span>
 </div>
</div>
<div id="view"></div>

<script src="config.js"></script>
<script>
const SLOTS={
 "qrPollStart":  {title:"Εκκίνηση & Απολογισμός (πριν/μετά)", type:"startend"},
 "qrPollL1close":{title:"Δ1 — Πρώτες εντυπώσεις", type:"text"},
 "qrPollL2":     {title:"Δ2 — Ποια απάντηση;", type:"single", key:"choice"},
 "qrPollL4":     {title:"Δ4 — Κατατάξτε", type:"classify"},
 "qrPollL7":     {title:"Δ7 — Το χάρτινο αρχείο", type:"single", key:"minutes"},
 "qrPollL9":     {title:"Δ9 — Από Δευτέρα", type:"single", key:"tool"},
 "qrFeedback":   {title:"Αξιολόγηση διαλέξεων", type:"feedback"}
};
const sel=document.getElementById("slotSel");
Object.entries(SLOTS).forEach(([k,v])=>{
  const o=document.createElement("option"); o.value=k; o.textContent=v.title; sel.appendChild(o);
});

function tally(rows,key){const m={};rows.forEach(r=>{const v=r.data?.[key];if(v!=null)m[v]=(m[v]||0)+1;});return m;}
function bars(map,endClass){
  const max=Math.max(1,...Object.values(map));
  const order=Object.entries(map).sort((a,b)=>b[1]-a[1]);
  return order.map(([k,n])=>`<div class="row">
     <div class="lbl">${esc(k)}</div>
     <div class="barwrap"><div class="bar ${endClass?'end':''}" style="width:${n/max*100}%"></div></div>
     <div class="cnt">${n}</div></div>`).join("") || `<p class="qlabel">— καμία απάντηση ακόμη —</p>`;
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

async function load(){
  const slot=sel.value, cfg=SLOTS[slot], view=document.getElementById("view");
  let q;
  if(cfg.type==="startend"){
    const {data}=await sb.from("votes").select("slot,data,created_at").in("slot",["qrPollStart_start","qrPollStart_end"]);
    lastRows=data||[]; lastSlot=slot;
    render_startend(data||[]);
    document.getElementById("total").textContent=(data?.length||0)+" απαντήσεις";
    return;
  }
  const {data}=await sb.from("votes").select("data,created_at").eq("slot",slot);
  const rows=data||[]; lastRows=rows; lastSlot=slot;
  document.getElementById("total").textContent=rows.length+" απαντήσεις";

  if(cfg.type==="single"){
    view.innerHTML=`<div class="card"><h2>${cfg.title}</h2>${bars(tally(rows,cfg.key))}</div>`;
  } else if(cfg.type==="classify"){
    const parts=[["smartwatch","Smartwatch"],["drone","Drone με κάμερα"],["toy_laptop","Παιχνίδι-laptop"]];
    view.innerHTML=`<div class="card"><h2>${cfg.title}</h2>`+
      parts.map(([k,lbl])=>`<div class="qlabel">${lbl}</div>${bars(tally(rows,k))}`).join("")+`</div>`;
  } else if(cfg.type==="text"){
    const imp=rows.map(r=>r.data?.impressed).filter(Boolean);
    const con=rows.map(r=>r.data?.concern).filter(Boolean);
    view.innerHTML=`<div class="card"><h2>${cfg.title}</h2><div class="col2">
      <div><div class="qlabel">Τι εντυπωσίασε</div>${imp.map(t=>`<div class="txtitem">${esc(t)}</div>`).join("")||'<p class="qlabel">—</p>'}</div>
      <div><div class="qlabel">Τι προβληματίζει</div>${con.map(t=>`<div class="txtitem">${esc(t)}</div>`).join("")||'<p class="qlabel">—</p>'}</div>
    </div></div>`;
  } else if(cfg.type==="feedback"){
    const byLec={};
    rows.forEach(r=>{const L=r.data?.lecture||"?";(byLec[L]=byLec[L]||[]).push(r.data);});
    const lecs=Object.keys(byLec).sort((a,b)=>a-b);
    view.innerHTML=`<div class="card"><h2>${cfg.title}</h2>`+
      (lecs.length?lecs.map(L=>{
        const arr=byLec[L];
        const um=tally(arr.map(d=>({data:d})),"useful");
        const wishes=arr.map(d=>d.wish).filter(Boolean);
        return `<div class="qlabel">Διάλεξη ${esc(L)} — ${arr.length} απαντήσεις</div>${bars(um)}`+
          (wishes.length?`<div style="margin:6px 0 16px">`+wishes.map(w=>`<div class="txtitem">${esc(w)}</div>`).join("")+`</div>`:"");
      }).join(""):'<p class="qlabel">— καμία απάντηση ακόμη —</p>')+`</div>`;
  }
}

function render_startend(rows){
  const view=document.getElementById("view");
  const S=rows.filter(r=>r.slot==="qrPollStart_start");
  const E=rows.filter(r=>r.slot==="qrPollStart_end");
  function pairBlock(label,key){
    const ms=tally(S,key), me=tally(E,key);
    const keys=[...new Set([...Object.keys(ms),...Object.keys(me)])];
    const max=Math.max(1,...keys.map(k=>Math.max(ms[k]||0,me[k]||0)));
    const rowsHtml=keys.map(k=>`
      <div class="row"><div class="lbl">${esc(k)}</div>
        <div class="barwrap"><div class="bar" style="width:${(ms[k]||0)/max*100}%"></div></div>
        <div class="cnt">${ms[k]||0}</div></div>
      <div class="row"><div class="lbl"></div>
        <div class="barwrap"><div class="bar end" style="width:${(me[k]||0)/max*100}%"></div></div>
        <div class="cnt">${me[k]||0}</div></div>`).join("");
    return `<div class="qlabel">${label}</div>
      <div class="legend"><span class="dot" style="background:var(--accent)"></span>Αρχή (Δ1)
        <span class="dot" style="background:var(--end)"></span>Τέλος (Δ10)</div>${rowsHtml}`;
  }
  view.innerHTML=`<div class="card"><h2>${SLOTS.qrPollStart.title}</h2>
    ${pairBlock("Ώρες/εβδομάδα σε ρουτίνα","hours")}
    ${pairBlock("Χρήση AI στη δουλειά","ai")}</div>`;
}

// ----- Export CSV (ό,τι slot είναι επιλεγμένο) -----
let lastRows=[], lastSlot="";
function exportCSV(){
  if(!lastRows.length){alert("Καμία απάντηση για εξαγωγή ακόμη.");return;}
  const keys=[...new Set(lastRows.flatMap(r=>Object.keys(r.data||{})))];
  const cols=["created_at", ...(lastSlot==="qrPollStart"?["slot"]:[]), ...keys];
  const q=v=>{v=v==null?"":String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const lines=[cols.join(",")];
  lastRows.forEach(r=>lines.push(cols.map(c=>
    c==="created_at"?q(r.created_at):c==="slot"?q(r.slot):q(r.data?.[c])).join(",")));
  const blob=new Blob([String.fromCharCode(0xFEFF)+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=lastSlot+".csv"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
document.getElementById("export").onclick=exportCSV;

sel.onchange=load;
document.getElementById("refresh").onclick=load;
load();
setInterval(load,4000); // auto-refresh
</script>
</body>
</html>
