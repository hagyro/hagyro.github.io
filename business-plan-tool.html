<style>
  :root { --navy:#10131a; --accent:#2e86c1; --paper:#f7f5f0; --muted:#6b7280; --ochre:#c89b3c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter', -apple-system, 'Helvetica Neue', sans-serif; background:
    radial-gradient(1200px 600px at 70% -10%, #efe9dd 0%, var(--paper) 55%);
    min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--navy); }
  .gate { width:min(92vw, 420px); text-align:center; padding:2rem 0 3rem; }
  .mono { width:56px; height:56px; margin:0 auto 1.1rem; border:1px solid var(--ochre);
    display:flex; align-items:center; justify-content:center; font-family:Georgia, 'Times New Roman', serif;
    font-size:1.35rem; letter-spacing:.05em; background:#fff; }
  .kicker { color:var(--ochre); font-size:.72rem; letter-spacing:.28em; text-transform:uppercase; margin-bottom:.55rem; }
  h1 { font-family:Georgia, 'Playfair Display', serif; font-weight:600; font-size:1.6rem; margin-bottom:.5rem; }
  p.sub { color:var(--muted); font-size:.95rem; line-height:1.5; margin-bottom:1.6rem; }
  input { width:100%; padding:.85rem 1rem; font-size:1rem; border:1.5px solid var(--accent);
    border-radius:8px; background:#fffdfa; outline:none; }
  input:focus { box-shadow:0 0 0 3px rgba(46,134,193,.18); }
  button { width:100%; margin-top:.7rem; padding:.85rem 1rem; font-size:1rem; font-weight:600;
    color:#fff; background:var(--navy); border:none; border-radius:8px; cursor:pointer; }
  button:hover { background:#1d2634; }
  button:disabled { opacity:.6; cursor:wait; }
  .err { color:#b3261e; font-size:.88rem; min-height:1.3em; margin-top:.7rem; }
  .foot { margin-top:2rem; padding-top:1.1rem; border-top:1px solid #e5e0d5; color:var(--muted);
    font-size:.78rem; letter-spacing:.14em; }
  .foot a { color:var(--muted); }
</style>

const SS_KEY = "gate_pw_bpt";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const salt = b64(PAYLOAD.salt), iv = b64(PAYLOAD.iv), ct = b64(PAYLOAD.ct);
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt, iterations:PAYLOAD.iter, hash:"SHA-256" },
    km, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv }, key, ct);
  return new TextDecoder().decode(pt);
}
async function attempt(pw, silent) {
  const btn = document.getElementById("btn"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = "";
  try {
    const html = await unlock(pw);
    try { sessionStorage.setItem(SS_KEY, pw); } catch(e) {}
    document.open(); document.write(html); document.close();
  } catch(e) {
    btn.disabled = false;
    if (!silent) err.textContent = "Λάθος κωδικός. Δοκιμάστε ξανά.";
  }
}
document.getElementById("f").addEventListener("submit", ev => {
  ev.preventDefault();
  const pw = document.getElementById("pw").value;
  if (pw) attempt(pw, false);
});
try {
  const saved = sessionStorage.getItem(SS_KEY);
  if (saved) attempt(saved, true);
} catch(e) {}
</script>
